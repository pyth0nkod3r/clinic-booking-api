# Render Blueprint: one repo, two services (API + SPA), plus the docs site
# that already runs from the same repo.
services:
  - type: web
    name: clinic-booking-api
    runtime: python
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false

  - type: web
    name: clinic-booking-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: build/client
    rewrites:
      - source: /*
        destination: /index.html  # also mirrored in web/public/_redirects
    envVars:
      - key: VITE_API_BASE
        value: https://clinic-booking-api-lwo2.onrender.com
      - key: VITE_API_KEY
        sync: false

  - type: web
    name: clinic-booking-docs
    runtime: static
    rootDir: docs
    staticPublishPath: .
